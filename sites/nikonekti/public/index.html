<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikonekti — Connecting Africa's Digital Future</title>
    <meta name="description" content="Nikonekti is a technology company building innovative digital solutions for African businesses and communities.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #0f172a; line-height: 1.6; }
        .page { min-height: 100vh; display: flex; flex-direction: column; }
        header { padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; width: 100%; }
        .logo { font-size: 1.3rem; font-weight: 800; color: #0f766e; letter-spacing: -0.5px; }
        .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 2rem; text-align: center; }
        .hero h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; line-height: 1.2; margin-bottom: 1.5rem; }
        .hero h1 span { background: linear-gradient(135deg, #0f766e, #14b8a6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.15rem; color: #64748b; max-width: 600px; margin-bottom: 2.5rem; }
        .btn { display: inline-block; padding: 0.85rem 2rem; background: linear-gradient(135deg, #0f766e, #14b8a6); color: #fff; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 1rem; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .badge { display: inline-block; padding: 0.4rem 1rem; background: #ecfdf5; color: #0f766e; border-radius: 999px; font-size: 0.8rem; font-weight: 600; margin-bottom: 1.5rem; }
        footer { padding: 2rem; text-align: center; font-size: 0.8rem; color: #94a3b8; border-top: 1px solid #e2e8f0; }
        @media (max-width: 640px) { .hero h1 { font-size: 2rem; } .hero p { font-size: 1rem; } }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <div class="logo">nikonekti</div>
        </header>
        <section class="hero">
            <div class="badge">Coming Soon</div>
            <h1>Connecting <span>Africa's Digital</span> Future</h1>
            <p>We're building innovative technology solutions that empower African businesses and communities to thrive in the digital economy.</p>
            <a href="mailto:hello@nikonekti.com" class="btn">Get in Touch</a>
        </section>
        <footer>
            &copy; 2026 Nikonekti. All rights reserved.
        </footer>
    </div>
</body>
</html>
