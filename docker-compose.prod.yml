services:
  postgres:
    image: postgres:16-alpine
    container_name: afri-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:?Set DB_BOOTSTRAP_PASSWORD in .env.production}
      POSTGRES_DB: ${DB_NAME:-afri_market}
    volumes:
      - afri-market-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_BOOTSTRAP_USER:-postgres} -d ${DB_NAME:-afri_market}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - afri-market

  redis:
    image: redis:7-alpine
    container_name: afri-market-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
      - afri-market-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - afri-market

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afri-market-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      APP_NAME: afriMarket
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_BOOTSTRAP_USER: ${DB_BOOTSTRAP_USER:-postgres}
      DB_BOOTSTRAP_PASSWORD: ${DB_BOOTSTRAP_PASSWORD}
      DB_NAME: ${DB_NAME:-afri_market}
      DB_OWNER_USER: ${DB_OWNER_USER:-postgres}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-${DB_BOOTSTRAP_PASSWORD}}
      DB_RUNTIME_USER: ${DB_RUNTIME_USER:-${DB_OWNER_USER}}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:-${DB_OWNER_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-https://yourdomain.com/api/webhooks/mpesa}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - afri-market

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: afri-market-web
    restart: unless-stopped
    networks:
      - afri-market

  nginx:
    image: nginx:alpine
    container_name: afri-market-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./sites:/var/www:ro
    depends_on:
      - api
      - web
    networks:
      - afri-market

volumes:
  afri-market-postgres-data:
  afri-market-redis-data:

networks:
  afri-market:
    driver: bridge
