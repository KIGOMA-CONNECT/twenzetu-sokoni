services:
  postgres:
    image: postgres:16-alpine
    container_name: afri-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:?Set DB_BOOTSTRAP_PASSWORD in .env.production}
      POSTGRES_DB: ${DB_NAME:-afri_market}
    volumes:
      - afri-market-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_BOOTSTRAP_USER:-postgres} -d ${DB_NAME:-afri_market}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - afri-market

  redis:
    image: redis:7-alpine
    container_name: afri-market-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production} --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - afri-market-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - afri-market

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afri-market-api
    restart: unless-stopped
    ports:
      - '127.0.0.1:3300:3000'
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      APP_NAME: afriMarket
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_BOOTSTRAP_USER: ${DB_BOOTSTRAP_USER:-postgres}
      DB_BOOTSTRAP_PASSWORD: ${DB_BOOTSTRAP_PASSWORD}
      DB_NAME: ${DB_NAME:-afri_market}
      DB_OWNER_USER: ${DB_OWNER_USER:-postgres}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-${DB_BOOTSTRAP_PASSWORD}}
      DB_RUNTIME_USER: ${DB_RUNTIME_USER:-${DB_OWNER_USER}}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:-${DB_OWNER_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PAYMENT_CONFIRM_SECRET: ${PAYMENT_CONFIRM_SECRET:?Set PAYMENT_CONFIRM_SECRET in .env.production}
      WEBHOOK_INTERNAL_SECRET: ${WEBHOOK_INTERNAL_SECRET:?Set WEBHOOK_INTERNAL_SECRET in .env.production}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-https://yourdomain.com/api/webhooks/mpesa}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-production}
      AZAMPAY_APP_NAME: ${AZAMPAY_APP_NAME:-}
      AZAMPAY_CLIENT_ID: ${AZAMPAY_CLIENT_ID:-}
      AZAMPAY_CLIENT_SECRET: ${AZAMPAY_CLIENT_SECRET:-}
      AZAMPAY_API_KEY: ${AZAMPAY_API_KEY:-}
      AZAMPAY_ENVIRONMENT: ${AZAMPAY_ENVIRONMENT:-sandbox}
      AZAMPAY_CALLBACK_URL: ${AZAMPAY_CALLBACK_URL:-https://yourdomain.com/api/webhooks/azampay}
      METRICS_SECRET: ${METRICS_SECRET:?Set METRICS_SECRET in .env.production}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@afrimarket.co.tz}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - afri-market

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: afri-market-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:3301:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:80']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - afri-market

  nginx:
    image: nginx:alpine
    container_name: afri-market-nginx
    restart: unless-stopped
    profiles:
      - legacy-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./sites:/var/www:ro
    depends_on:
      - api
      - web
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:80/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    networks:
      - afri-market

volumes:
  afri-market-postgres-data:
  afri-market-redis-data:

networks:
  afri-market:
    driver: bridge
