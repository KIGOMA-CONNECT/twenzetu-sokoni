services:
  abms-postgres:
    image: postgres:16-alpine
    container_name: abms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: abms
      DB_OWNER_USER: abms_owner
      DB_OWNER_PASSWORD: abms_owner_dev_password
      DB_RUNTIME_USER: abms_runtime
      DB_RUNTIME_PASSWORD: abms_runtime_dev_password
    ports:
      - '5435:5432'
    volumes:
      - abms-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-abms.sh:/docker-entrypoint-initdb.d/10-init-abms.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d abms']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  abms-redis:
    image: redis:7-alpine
    container_name: abms-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - abms-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  abms-api:
    build:
      context: .
      dockerfile: Dockerfile.abms
    container_name: abms-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      APP_PORT: 3001
      APP_NAME: abms
      APP_ENV: development
      DB_HOST: abms-postgres
      DB_PORT: 5432
      DB_BOOTSTRAP_USER: postgres
      DB_BOOTSTRAP_PASSWORD: postgres
      DB_NAME: abms
      DB_OWNER_USER: abms_owner
      DB_OWNER_PASSWORD: abms_owner_dev_password
      DB_RUNTIME_USER: abms_runtime
      DB_RUNTIME_PASSWORD: abms_runtime_dev_password
      JWT_SECRET: abms-dev-jwt-secret
      JWT_EXPIRY: 1h
      OTP_EXPIRY_MINUTES: 5
      OTP_LENGTH: 6
      CORS_ORIGINS: http://localhost:3001,http://localhost:4200
      REDIS_URL: redis://abms-redis:6379
    depends_on:
      abms-postgres:
        condition: service_healthy
      abms-redis:
        condition: service_healthy

volumes:
  abms-postgres-data:
  abms-redis-data:
