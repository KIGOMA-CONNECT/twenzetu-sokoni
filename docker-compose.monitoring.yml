services:
  prometheus:
    image: prom/prometheus:latest
    container_name: afri-market-prometheus
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - afri-market-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: afri-market-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./docker/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./docker/monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./docker/monitoring/dashboards:/var/lib/grafana/dashboards
      - afri-market-grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    depends_on:
      prometheus:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:latest
    container_name: afri-market-node-exporter
    restart: unless-stopped
    ports:
      - '127.0.0.1:9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: afri-market-postgres-exporter
    restart: unless-stopped
    ports:
      - '127.0.0.1:9187:9187'
    environment:
      DATA_SOURCE_NAME: 'postgresql://${DB_RUNTIME_USER:-afri_runtime}:${DB_RUNTIME_PASSWORD:-afri_runtime_dev_password}@postgres:5432/${DB_NAME:-afri_market}?sslmode=disable'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  afri-market-prometheus-data:
  afri-market-grafana-data:

networks:
  default:
    name: afri-market_default
    external: true
