apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${DB_NAME:-afri_market}
    user: ${DB_RUNTIME_USER:-afri_runtime}
    secureJsonData:
      password: ${DB_RUNTIME_PASSWORD:-afri_runtime_dev_password}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
