global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-alerts'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 1h

receivers:
  - name: 'email-alerts'
    email_configs:
      - to: 'ops@afrimarket.co.tz'
        from: 'alerts@afrimarket.co.tz'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'alerts@afrimarket.co.tz'
        auth_password: '${ALERT_EMAIL_PASSWORD}'
        headers:
          Subject: 'afriMarket Alert: {{ .GroupLabels.alertname }}'

  - name: 'critical-alerts'
    email_configs:
      - to: 'ops@afrimarket.co.tz'
        from: 'alerts@afrimarket.co.tz'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'alerts@afrimarket.co.tz'
        auth_password: '${ALERT_EMAIL_PASSWORD}'
        headers:
          Subject: '🔴 CRITICAL: afriMarket {{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: '${SLACK_WEBHOOK_URL:-}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
