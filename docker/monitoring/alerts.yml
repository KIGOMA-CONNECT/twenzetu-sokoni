groups:
  - name: afrimarket-alerts
    rules:
      # API Down
      - alert: ApiDown
        expr: up{job="afrimarket-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "afriMarket API is DOWN"
          description: "API instance {{ $labels.instance }} has been down for more than 1 minute."

      # API High Latency
      - alert: ApiHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "afriMarket API high latency"
          description: "API p95 latency is {{ $value }}s (threshold: 2s)."

      # API High Error Rate
      - alert: ApiHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "afriMarket API error rate > 5%"
          description: "Error rate is {{ $value | humanizePercentage }}."

      # Database Down
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "Database instance {{ $labels.instance }} is not responding."

      # Database High Connections
      - alert: DatabaseHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL high connection count"
          description: "{{ $value }} active connections (threshold: 80)."

      # Redis Down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"
          description: "Redis instance {{ $labels.instance }} is not responding."

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Server memory usage > 90%"
          description: "Memory usage is {{ $value | humanizePercentage }}."

      # High Disk Usage
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Server disk usage > 90%"
          description: "Disk usage is {{ $value | humanizePercentage }}."

      # Low Wallet Balance (vendor can't pay suppliers)
      - alert: LowWalletBalance
        expr: wallet_balance < 10000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Vendor wallet balance low"
          description: "Vendor {{ $labels.vendor_id }} has only {{ $value }} TZS in wallet."
