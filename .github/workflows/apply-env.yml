name: Apply Server Env

on:
  workflow_dispatch:
    inputs:
      env_var:
        description: 'Env var to set (e.g. GOOGLE_MAPS_API_KEY)'
        required: true
        type: string
      env_value:
        description: 'Value to set'
        required: true
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply env var to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/afri-market
            KEY="${{ inputs.env_var }}"
            VALUE="${{ inputs.env_value }}"
            if grep -q "^${KEY}=" .env.production 2>/dev/null; then
              sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env.production
            else
              echo "${KEY}=${VALUE}" >> .env.production
            fi
            echo "Set ${KEY} in .env.production"
            docker compose -f docker-compose.prod.yml up -d api
            echo "API container restarted"
