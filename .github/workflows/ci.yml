name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint core projects
        run: npx nx run-many -t lint -p marketplace-application marketplace-api marketplace-domain marketplace-infrastructure core-http tenancy core-security core-finance web api

      - name: Test core projects
        run: npx nx run-many -t test -p marketplace-application marketplace-api core-http tenancy core-security core-finance

      - name: Build api + web
        run: npx nx run-many -t build -p api web

  e2e:
    needs: verify
    uses: ./.github/workflows/e2e.yml
