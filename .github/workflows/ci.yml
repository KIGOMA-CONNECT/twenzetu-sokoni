name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: 22
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  lint-and-typecheck:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline
      - run: npx nx run-many -t lint --projects=api,web --parallel=3

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afri_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline
      - run: npx nx run-many -t test --projects=api,marketplace-api,marketplace-application --parallel=1
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_BOOTSTRAP_USER: postgres
          DB_BOOTSTRAP_PASSWORD: postgres
          DB_NAME: afri_market_test
          DB_OWNER_USER: postgres
          DB_OWNER_PASSWORD: postgres
          DB_RUNTIME_USER: postgres
          DB_RUNTIME_PASSWORD: postgres
          # additional env aliases to avoid falling back to 'root'
          DB_USER: postgres
          DATABASE_USER: postgres
          DB_USERNAME: postgres
          DATABASE_USERNAME: postgres
          # POSgres client envs
          PGUSER: postgres
          PGPASSWORD: postgres
          # single DATABASE_URL for libs that prefer connection string
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/afri_market_test
          JWT_SECRET: ci-jwt-secret
          REDIS_URL: redis://localhost:6379

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline
      - run: npx nx run-many -t build --projects=api,web --parallel=3

# Deploy is handled server-side by /opt/afri-market/scripts/auto-deploy.sh (cron, every 2 min).
